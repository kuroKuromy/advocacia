
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMR LOGIN</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-image: url('backgrond login2.gif');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;

            background-color: rgba(105, 105, 105, 0.158);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            width: 380px;
            padding: 40px 30px;
            border-radius: 12px;
        }

        .login h2,
        .login p {
            color: #fff;
            margin: 0;
        }

        .login p {
            font-size: 0.9rem;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .login input {
            width: 100%;
            height: 44px;
            padding: 12px 40px 12px 16px;

            font-size: 15px;
            color: #fff;

            background-color: rgba(85, 70, 70, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            outline: none;

            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .login input:focus {
            background-color: #ffffff;
            color: #333;
            border-color: #8c5830;
            box-shadow: 0 0 8px rgba(140, 88, 48, 0.4);
        }

        .login input::placeholder {
            color: #ccc;
            font-weight: 500;
        }

        .btn {
            font-size: 1.2rem;
            font-weight: 700;
            padding: 11px 24px;
            border-radius: 8px;
            cursor: pointer;
            border: none;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            line-height: 1;
            transition: all 0.2s ease;

            background: #7c4c00;
            color: #ffffff;

            box-shadow: 0 6px 16px rgba(255, 205, 111, 0.35);
        }

        .btn:hover {
            opacity: 0.88;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 197, 111, 0.45);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            cursor: pointer;
            background: transparent;
            border: none;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

    </style>
</head>

<body>

    <div class="login">

        <h2>BEM VINDO</h2>
        <p>FAÇA LOGIN</p>

        <div class="input-group">
            <input
                type="email"
                id="emailInput"
                placeholder="EMAIL"
                required
                autocomplete="email"
            >
        </div>

        <div class="input-group">

            <input
                type="password"
                id="passwordInput"
                placeholder="SENHA"
                required
                autocomplete="current-password"
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword()"
            >
                <img
                    id="eyeIcon"
                    src="eyes open.png"
                    alt="Mostrar senha"
                >
            </button>

        </div>

        <button
            class="btn"
            type="button"
            id="loginBtn"
            disabled
        >
            LOGIN
        </button>

    </div>

    <script>

        // DADOS CORRETOS DO LOGIN
        const EMAIL_CORRETO = "teuemail@exemplo.com";
        const SENHA_CORRETA = "advogado123";


        // ELEMENTOS DO HTML
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');


        // VERIFICA SE OS CAMPOS ESTÃO PREENCHIDOS
        function validarCampos() {

            if (
                emailInput.value.trim() !== "" &&
                passwordInput.value.trim() !== ""
            ) {

                loginBtn.disabled = false;

            } else {

                loginBtn.disabled = true;

            }

        }


        // MONITORA OS CAMPOS
        emailInput.addEventListener('input', validarCampos);
        passwordInput.addEventListener('input', validarCampos);


        // MOSTRAR OU ESCONDER SENHA
        function togglePassword() {

            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {

                passwordInput.type = 'text';
                eyeIcon.src = 'eyes close.png';
                eyeIcon.alt = 'Esconder senha';

            } else {

                passwordInput.type = 'password';
                eyeIcon.src = 'eyes open.png';
                eyeIcon.alt = 'Mostrar senha';

            }

        }


        // VALIDAR LOGIN E REDIRECIONAR
        loginBtn.addEventListener('click', function() {

            const email = emailInput.value.trim();
            const senha = passwordInput.value;

            if (
                email === EMAIL_CORRETO &&
                senha === SENHA_CORRETA
            ) {

                alert("Login efetuado com sucesso!");

                // ABRE A PRÓXIMA PÁGINA
                window.location.href = "index.html";

            } else {

                alert("E-mail ou senha incorretos!");

            }

        });

    </script>

</body>
</html>
