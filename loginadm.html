<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>HMR</title>
        <style>
            .body{
                background-image: url('backgrond login2.gif');
                background-size: cover;   
                background-repeat: no-repeat; 
                background-position: center;  
                background-attachment: fixed;
                /* Centraliza a caixa de login na tela inteira perfeitamente */
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .login{
                display: flex;
                flex-direction: column; 
                justify-content: center; 
                align-items: center;
                gap: 15px;
                
                background-color: rgba(105, 105, 105, 0.158); 
                backdrop-filter: blur(12px);                 
                -webkit-backdrop-filter: blur(12px);

                width: 380px;
                padding: 40px 30px;
                border-radius: 12px;
                box-sizing: border-box;
            }
            .login h2, .login p {
                color: #fff;
                margin: 0;
            }

            .login p {
                font-size: 0.9rem;
                margin-bottom: 10px;
                opacity: 0.8;
            }

            .input-group {
                position: relative;
                width: 100%;
            }
            .login input {
            width: 300px;
            height: 20px;
            padding: 12px 16px;
            font-size: 15px;
            color: #333;
            background-color: rgba(85, 70, 70, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }


            .login input:focus {
            background-color: #ffffff;
            border-color: #8c5830; /* Tom alinhado com o fundo */
            box-shadow: 0 0 8px rgba(140, 88, 48, 0.4);
            }


            .login input::placeholder {
            color: #777;
            font-weight: 500;
            }
            .btn {
  font-size: 1.2rem;
  font-weight: 700;
  padding: 11px 24px;
  border-radius: 8px;
  cursor: pointer;
  border: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  transition: all 0.2s ease;
  background: #7c4c00;
  color: #ffffff;
  box-shadow: 0 6px 16px rgba(255, 205, 111, 0.35);
}
.btn:hover {
  opacity: 0.88;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(255, 197, 111, 0.45);
}
.toggle-password {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                background: transparent !important;
                border: none !important;
                outline: none !important;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }         
        </style>
    </head>
    <body class="body">
        <div class="login">
            <H2>BEM VINDO</H2>
            <P>FAÇA LOGIN</P>
            <div class="input-group">
            <input type="email" id="emailInput" placeholder="EMAIL" required autocomplete="email">
            </div>
            
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="SENHA" required autocomplete="current-password">
                <button type="button" class="toggle-password" onclick="togglePassword()">
                    <img id="eyeIcon" src="eyes open.png" alt="Mostrar Senha">
                </button>
            </div>

            <button class="btn" type="submit">LOGIN</button>
        </div>
        </div>
        <script>
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');
            const loginBtn = document.getElementById('loginBtn');

            // Função que valida se ambos os campos estão preenchidos
            function validarCampos() {
                if (emailInput.value.trim() !== "" && passwordInput.value.trim() !== "") {
                    loginBtn.removeAttribute('disabled'); // Libera o botão
                } else {
                    loginBtn.setAttribute('disabled', 'true'); // Mantém bloqueado
                }
            }

            // Ouve sempre que o utilizador escreve algo em qualquer um dos campos
            emailInput.addEventListener('input', validarCampos);
            passwordInput.addEventListener('input', validarCampos);
            function togglePassword() {
                const passwordInput = document.getElementById('passwordInput');
                const toggleIcon = document.querySelector('.toggle-password');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeIcon.src = 'eyes close.png'; 
                } else {
                    passwordInput.type = 'password';
                    eyeIcon.src = 'eyes open.png'; 
                }
            }
        </script>
    </body>
</html>
