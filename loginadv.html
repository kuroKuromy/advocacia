<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>HMR</title>

    <style>
        body {
            background-image: url('login2.JPG');
            background-size: cover;   
            background-repeat: no-repeat; 
            background-position: center;  
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .login2 {
            display: flex;
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            gap: 30px;
            
            background-color: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(12px);                
            -webkit-backdrop-filter: blur(12px);

            width: 1200px;
            height: 500px;
            padding: 40px 30px;
            border-radius: 12px;
            box-sizing: border-box;
            position: relative;
        }

        .login2 h2 {
            color: #090909;
            margin: 0;
            font-size: 1.8rem;
        }

        /* Container dos 3 perfis - Espaçamento maior entre eles */
        .profiles-container {
            display: flex;
            gap: 70px; 
            margin-top: 10px;
        }

        .profile-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .profile-item:hover {
            transform: scale(1.05);
        }

        /* Tamanho maior dos avatares */
        .profile-avatar {
            width: 140px;  
            height: 140px; 
            border-radius: 50%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar svg {
            width: 80px;  
            height: 80px;
            fill: #fff;
        }

        .profile-name {
            font-weight: bold;
            color: #333;
            font-size: 1.1rem;
        }

        /* Modal Overlay (Layout de Senha) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: #4a4a4a;
            width: 320px;
            padding: 30px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .modal-card .profile-avatar {
            width: 100px;  
            height: 100px;
            margin-top: -60px;
            border: 4px solid #4a4a4a;
        }

        .modal-card h3 {
            color: #fff;
            margin: 10px 0 0 0;
            font-size: 1.1rem;
        }

        .modal-card input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 20px 0 15px 0;
            border: none;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }

        .modal-card button {
            width: 100%;
            padding: 12px;
            background-color: #2b2b2b;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-card button:hover {
            background-color: #1a1a1a;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login2">
        <h2>Selecione seu perfil</h2>
        
        <div class="profiles-container">
            <!-- Perfil 1 -->
            <div class="profile-item" onclick="openPasswordModal('adv1')">
                <div class="profile-avatar">
                    <img src="foto1.jpg" alt="Advogado 1">
                </div>
                <span class="profile-name">Advogado 1</span>
            </div>

            <!-- Perfil 2 -->
            <div class="profile-item" onclick="openPasswordModal('adv2')">
                <div class="profile-avatar">
                    <img src="foto2.jpg" alt="Advogado 2">
                </div>
                <span class="profile-name">Advogado 2</span>
            </div>

            <!-- Perfil 3 -->
            <div class="profile-item" onclick="openPasswordModal('adv3')">
                <div class="profile-avatar">
                    <img src="foto3.png" alt="Advogado 3">
                </div>
                <span class="profile-name">Advogado 3</span>
            </div>
        </div>
    </div>

    <!-- Modal Layout para colocar a senha -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-card">
            <span class="close-btn" onclick="closePasswordModal()">&times;</span>
            <div class="profile-avatar" id="modalAvatarContainer"></div>
            <h3 id="modalProfileName"></h3>
            <input type="password" placeholder="Digite sua senha" id="passwordInput" onkeydown="handleKeyPress(event)">
            <button onclick="login()">Entrar</button>
        </div>
    </div>

    <script>
        // Mapeamento dos perfis com senha e URL de destino
        const usersData = {
            'adv1': {
                name: 'Advogado 1',
                image: 'foto1.jpg',
                password: 'alexa123',
                redirectUrl: 'alexaprofile.html'
            },
            'adv2': {
                name: 'Advogado 2',
                image: 'foto2.jpg',
                password: 'eduardo123',
                redirectUrl: 'perfil_adv2.html'
            },
            'adv3': {
                name: 'Advogado 3',
                image: 'foto3.png',
                password: 'roberto123',
                redirectUrl: 'perfil_adv3.html'
            }
        };

        let activeUserId = null;

        function openPasswordModal(userId) {
            activeUserId = userId;
            const user = usersData[userId];

            document.getElementById('modalProfileName').innerText = user.name;
            document.getElementById('modalAvatarContainer').innerHTML = `<img src="${user.image}" alt="${user.name}">`;

            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
            activeUserId = null;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                login();
            }
        }

        function login() {
            if (!activeUserId) return;

            const inputPassword = document.getElementById('passwordInput').value;
            const currentUser = usersData[activeUserId];

            if (inputPassword === currentUser.password) {
                window.location.href = currentUser.redirectUrl;
            } else {
                alert('Senha incorreta. Tente novamente.');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }
    </script>
</body>
</html>
